<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mosaïque 3 photos verticales — plein écran</title>
<style>
  :root{
    --gap:12px;
    --topbar-h:64px;
    --bg:#fafafa;
    --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; background:var(--bg); font-family:system-ui,Arial}
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden; /* empêche scroll vertical */
  }

  /* Topbar vide prêt à recevoir du contenu */
  .topbar{
    height:var(--topbar-h);
    display:flex;
    align-items:center;
    padding:0 18px;
    background:var(--card);
    box-shadow:0 1px 6px rgba(0,0,0,0.06);
    gap:12px;
  }

  /* Conteneur principal occupe le reste de la hauteur */
  .main{
    flex:1 1 auto;
    padding:12px;
    display:grid;
    grid-template-columns: repeat(3, 1fr); /* 3 colonnes égales */
    gap:var(--gap);
    height: calc(100vh - var(--topbar-h) - 24px); /* garantit pas de scroll */
  }

  /* Chaque case force un ratio vertical pour homogénéité,
     images conservent leur ratio via object-fit */
  .panel{
    width:100%;
    height:100%;
    display:block;
    border-radius:8px;
    overflow:hidden;
    background:linear-gradient(90deg,#eee,#ddd);
  }
  .panel img{
    width:100%;
    height:100%;
    object-fit:cover; /* gère formats/dimensions différentes */
    display:block;
  }

  /* Responsive: sur petits écrans on empile en colonne */
  @media (max-width:900px){
    .main{ grid-template-columns: repeat(2,1fr); grid-auto-rows:1fr; height: calc(100vh - var(--topbar-h) - 24px); }
  }
  @media (max-width:600px){
    .main{ grid-template-columns: 1fr; grid-auto-rows:1fr; }
  }
</style>
</head>
<body>

  <div class="topbar" id="topbar">
Vendredi 7 février 2025
  </div>

  <main class="main" role="main">
    <div class="panel"><img src="boitiers_A.jpg" alt="A"></div>
    <div class="panel"><img src="boitiers_B.jpg" alt="B"></div>
    <div class="panel"><img src="boitiers_C.jpg" alt="C"></div>
  </main>

</body>
</html>
