<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Composition</title>
<style>
  :root{
    --gap:12px;
    --topbar-h:64px;
    --bg:#fafafa;
    --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; background:var(--bg); font-family:system-ui,Arial}
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }
  .topbar{
    height:var(--topbar-h);
    display:flex;
    align-items:center;
    padding:0 18px;
    background:var(--card);
    box-shadow:0 1px 6px rgba(0,0,0,0.06);
    gap:12px;
  }
  .main{
    flex:1 1 auto;
    padding:12px;
    display:grid;
    grid-template-columns: repeat(2, 1fr); /* ← 2 colonnes */
    gap:var(--gap);
    height: calc(100vh - var(--topbar-h) - 24px);
  }
  .panel{
    width:100%;
    height:100%;
    display:block;
    border-radius:8px;
    overflow:hidden;
    background:linear-gradient(90deg,#eee,#ddd);
  }
  .panel img{
    width:100%;
    height:100%;
    object-fit:contain; /* ← pas de zoom/rognage */
    display:block;
  }
  @media (max-width:600px){
    .main{ grid-template-columns: 1fr; grid-auto-rows:1fr; }
  }
</style>
</head>
<body>
  <div class="topbar" id="topbar">
Situation hebergement Noel 2024 [verifiable DRH]- toute la famille logeur présente dans la maison - Période de deuil - 
  </div>
  <main class="main" role="main">
    <div class="panel"><img src="compo_A.jpg" alt="A"></div>
    <div class="panel"><img src="compo_B.jpg" alt="B"></div>
  </main>
</body>
</html>
