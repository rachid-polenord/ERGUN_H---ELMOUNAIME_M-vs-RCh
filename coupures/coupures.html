<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mosaïque 3 photos verticales — plein écran</title>
<style>
  :root{
    --gap:12px;
    --topbar-h:64px;
    --bg:#fafafa;
    --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; background:var(--bg); font-family:system-ui,Arial}
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }
  .topbar{
    height:var(--topbar-h);
    display:flex;
    align-items:center;
    padding:0 18px;
    background:var(--card);
    box-shadow:0 1px 6px rgba(0,0,0,0.06);
    gap:12px;
  }
  .main{
    flex:1 1 auto;
    padding:12px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:var(--gap);
    height: calc(100vh - var(--topbar-h) - 24px);
  }
  .panel{
    width:100%;
    height:100%;
    display:block;
    border-radius:8px;
    overflow:hidden;
    background:linear-gradient(90deg,#eee,#ddd);
  }
  .panel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  @media (max-width:900px){
    .main{ grid-template-columns: repeat(2,1fr); grid-auto-rows:1fr; height: calc(100vh - var(--topbar-h) - 24px); }
  }
  @media (max-width:600px){
    .main{ grid-template-columns: 1fr; grid-auto-rows:1fr; }
  }
  /* AJOUT : modale */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ width:90%; height:85vh; background:#fff; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid #eee; flex-shrink:0; }
  .modal-close{ background:none; border:none; font-size:20px; cursor:pointer; }
  .modal-box iframe{ flex:1; width:100%; border:none; }
</style>
</head>
<body>
  <div class="topbar" id="topbar">
Coupure d'électricité du 28/05 vers 18:00 - 31/05 à 16h30, Paul remet l'électricité - d'après Paul un seul disjoncteur était abaisser - coupure 31-05-2026 > un orage ne coupe pas l'électricité coté salle d'étude
<button onclick="document.getElementById('help-modal-2').classList.add('open')" style="margin-left:auto;flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid #ccc; color:#e7ff00;background:#FF0000;cursor:pointer;font-weight:bold;font-size:25px;">?</button>
<button onclick="document.getElementById('help-modal').classList.add('open')" style="flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1px solid #ccc; color:#e7ff00;background:#FF0000;cursor:pointer;font-weight:bold;font-size:25px;">?</button>
  </div>
  <main class="main" role="main">
    <div class="panel"><img src="coupure_A.jpg" alt="A"></div>
    <div class="panel"><img src="coupure_B.jpg" alt="B"></div>
    <div class="panel"><img src="coupure_C.jpg" alt="C"></div>
  </main>
  <div class="modal-overlay" id="help-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Aide</span>
        <button class="modal-close" onclick="document.getElementById('help-modal').classList.remove('open')">✕</button>
      </div>
      <iframe src="infos_coupures.html"></iframe>
    </div>
  </div>
  <div class="modal-overlay" id="help-modal-2">
    <div class="modal-box">
      <div class="modal-header">
        <span>Aide</span>
        <button class="modal-close" onclick="document.getElementById('help-modal-2').classList.remove('open')">✕</button>
      </div>
      <iframe src="infos_Paul.html"></iframe>
    </div>
  </div>
</body>
</html>
