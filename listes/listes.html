<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Liste temoin</title>
<style>
  :root{
    --gap:12px;
    --topbar-h:64px;
    --bg:#333;
    --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; background:var(--bg); font-family:system-ui,Arial}
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }
  .topbar{
    height:var(--topbar-h);
    display:flex;
    align-items:center;
    padding:0 18px;
    background:var(--card);
    box-shadow:0 1px 6px rgba(0,0,0,0.06);
    gap:12px;
  }
  .main{
    flex:1 1 auto;
    padding:12px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr;
    gap:var(--gap);
    height: calc(100vh - var(--topbar-h) - 24px);
    align-items: end; /* aligne tout en bas */
  }

  /* Panneaux 1 et 2 : hauteur pleine */
  .panel{
    border-radius:8px;
    overflow:hidden;
    background:linear-gradient(90deg,#eee,#ddd);
  }
  .panel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .panel-a,
  .panel-b {
    height: 100%; /* pleine hauteur */
    align-self: end;
  }

  /* Panneau 3 : plus court (~55% de la hauteur), aligné en haut */
  .panel-c {
    height: 55%;
    align-self: start; /* collé en haut */
  }

  @media (max-width:900px){
    .main{ grid-template-columns: repeat(2,1fr); align-items:stretch; }
    .panel-a,.panel-b,.panel-c{ height:300px; align-self:auto; }
  }
  @media (max-width:600px){
    .main{ grid-template-columns: 1fr; }
    .panel-a,.panel-b,.panel-c{ height:260px; }
  }
</style>
</head>
<body>
  <div class="topbar" id="topbar">
    Lundi 4 mai 2026 - liste temoin
  </div>
  <main class="main" role="main">
    <div class="panel panel-a"><img src="liste_1.jpg" alt="A"></div>
    <div class="panel panel-b"><img src="liste_2.PNG" alt="B"></div>
    <div class="panel panel-c"><img src="liste_3.PNG" alt="C"></div>
  </main>
</body>
</html>
