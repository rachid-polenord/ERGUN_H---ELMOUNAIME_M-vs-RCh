<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Liste temoin</title>
<style>
  :root{
    --gap:12px;
    --topbar-h:64px;
    --bg:#008B8B;
    --card:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0; background:var(--bg); font-family:system-ui,Arial}
  body{
    color:#000;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }
  .topbar{
    height:var(--topbar-h);
    display:flex;
    align-items:center;
    padding:0 18px;
    background:var(--card);
    box-shadow:0 1px 6px rgba(0,0,0,0.06);
    gap:12px;
  }

  /* Grille : 3 colonnes, 2 lignes.
     A et B occupent les deux lignes (pleine hauteur),
     C au-dessus de D dans la 3ᵉ colonne. */
  .main{
    flex:1 1 auto;
    padding:12px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr 1fr; /* deux lignes pour empiler C et D */
    gap:var(--gap);
    height: calc(100vh - var(--topbar-h) - 24px);
    align-items: stretch;
  }

  .panel{
    border-radius:8px;
    overflow:hidden;
    background:linear-gradient(90deg,#eee,#ddd);
    height:100%;
    width:100%;
    display:block;
  }

  .panel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* Positionnement explicite des panels */
  .panel-a { grid-column: 1 / 2; grid-row: 1 / 3; } /* occupe les 2 lignes */
  .panel-b { grid-column: 2 / 3; grid-row: 1 / 3; } /* occupe les 2 lignes */
  .panel-c { grid-column: 3 / 4; grid-row: 1 / 2; } /* haut à droite */
  .panel-d { grid-column: 3 / 4; grid-row: 2 / 3; } /* bas à droite */

  @media (max-width:900px){
    .main{ grid-template-columns: repeat(2,1fr); grid-template-rows: 1fr 1fr  ; align-items:stretch; }
    /* Réorganiser pour 2 colonnes : A et B prennent la première colonne chacune, C/D dans la seconde */
    .panel-a { grid-column: 1 / 2; grid-row: 1 / 2; }
    .panel-b { grid-column: 1 / 2; grid-row: 2 / 3; }
    .panel-c { grid-column: 2 / 3; grid-row: 1 / 2; height:300px; }
    .panel-d { grid-column: 2 / 3; grid-row: 2 / 3; height:300px; }
  }

  @media (max-width:600px){
    .main{ grid-template-columns: 1fr; grid-template-rows: repeat(4, auto); }
    .panel-a { grid-column: 1 / 2; grid-row: 1 / 2; height:260px; }
    .panel-b { grid-column: 1 / 2; grid-row: 2 / 3; height:260px; }
    .panel-c { grid-column: 1 / 2; grid-row: 3 / 4; height:260px; }
    .panel-d { grid-column: 1 / 2; grid-row: 4 / 5; height:260px; }
  }
</style>
</head>
<body>
  <div class="topbar" id="topbar">
    Lundi 4 mai 2026 - retrouver le Dimanche 10 mai sur mon bureau - liste temoin placer dans les listes de présence afin de verifier les déplacements de ces dernières
  </div>
  <main class="main" role="main">
    <div class="panel panel-a"><img src="liste_1.jpg" alt="Image A"></div>
    <div class="panel panel-b"><img src="liste_2.PNG" alt="Image B"></div>
    <div class="panel panel-c"><img src="liste_3.PNG" alt="Image C"></div>
    <div class="panel panel-d"><img src="liste_4.PNG" alt="Image D"></div>
  </main>
    <script src="bouton_infos.js" defer></script>
</body>
</html>
